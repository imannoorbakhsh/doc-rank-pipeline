[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-rank-pipeline"
version = "0.1.0"
description = "Offline document ranking evaluation pipeline for Raspberry Pi-class hardware"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
doc-rank = "doc_rank_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["doc_rank_pipeline*"]
